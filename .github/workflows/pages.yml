name: Build and deploy browser game

on:
  push:
    branches:
      - main
      - web-deployment
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pygbag
        run: python -m pip install pygbag

      - name: Build browser game
        run: python -m pygbag --build --ume_block 0 --title "Nano Escape + Signal" .

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload browser game
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
